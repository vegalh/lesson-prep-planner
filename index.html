<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Prep Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone-shell">
  <header class="brand">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 46 46" role="presentation">
        <path d="M23 39V19M23 26l-8-7M23 23l8-9M23 30l11-7M17 39h12" stroke="#4b7c63" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="13" cy="16" r="6" fill="#4b7c63" />
        <circle cx="23" cy="11" r="7" fill="#4b7c63" />
        <circle cx="33" cy="12" r="6" fill="#d98b62" />
        <circle cx="36" cy="23" r="5.5" fill="#4b7c63" />
        <circle cx="15" cy="25" r="5" fill="#d98b62" />
      </svg>
    </span>
    <h1>Lesson Prep Planner</h1>
  </header>

  <main>
    <section class="panel panel-mint" aria-labelledby="schedule-heading">
      <h2 id="schedule-heading">Schedule an Activity</h2>
      <p>Pick a starter activity and a date to add it to your plan.</p>

      <form id="schedule-form" novalidate>
        <label for="activity-select">Activity</label>
        <select id="activity-select" name="activity"></select>
        <span class="inline-error" id="activity-error" hidden></span>

        <label for="date-input">Date</label>
        <input type="date" id="date-input" name="date">
        <span class="inline-error" id="date-error" hidden></span>
        <span class="field-hint">This is a planner for upcoming prep — only today and future dates can be scheduled.</span>

        <button type="submit" class="pill-btn">+ Add to Plan</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="overview-heading">
      <h2 id="overview-heading" class="section-label">Overview</h2>
      <div class="summary-chips" id="summary-chips"></div>

      <label for="date-filter">Filter by date</label>
      <select id="date-filter"></select>
    </section>

    <section aria-labelledby="activities-heading">
      <h2 id="activities-heading" class="section-label">Upcoming Activities</h2>
      <div id="activities-list"></div>
    </section>

    <section class="panel reset-panel" aria-label="Reset plan">
      <button type="button" id="reset-button" class="pill-btn pill-btn-silver">Reset Plan</button>
      <p class="empty-message" id="reset-confirmation" role="status" hidden>Plan reset.</p>
    </section>
  </main>
</div>

<script src="activities-data.js"></script>
<script src="app.js"></script>
</body>
</html>
